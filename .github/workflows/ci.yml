name: scala-gateway-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Scala
        run: mvn -B -ntp clean verify
      - name: Dependency audit
        run: mvn -B -ntp org.owasp:dependency-check-maven:12.1.3:check -DfailBuildOnCVSS=7
      - name: Build image
        run: docker build -t sky-scala-gateway:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-scala-gateway:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Smoke health
        run: |
          id=$(docker run -d -p 18080:8080 -e ROUTES='/api=http://127.0.0.1:9000' sky-scala-gateway:ci)
          trap 'docker rm -f "$id"' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:18080/healthz && exit 0; sleep 1; done
          docker logs "$id"
          exit 1
